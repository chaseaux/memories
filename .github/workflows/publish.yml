name: Update Notion and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [notion_changed]
  schedule:
    # 04:17 Japan Standard Time. Scheduled runs may start later during GitHub congestion.
    - cron: '17 19 * * *'

concurrency:
  group: memories-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Install image build tools
        run: python3 -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Check sync behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check animation optimizations
        run: node --test tests/paper.test.cjs tests/archive.test.cjs tests/webhook.test.mjs
      - name: Read current Notion records
        if: github.event_name != 'push'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/sync_notion.py
      - name: Save changed snapshot
        id: snapshot
        shell: bash
        run: |
          git add -- data.js assets/covers
          if [ -f .notion-sync-state.json ]; then git add -- .notion-sync-state.json; fi
          if git diff --cached --quiet -- data.js assets/covers; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update Notion snapshot'
            git push origin HEAD:main
          fi
      - name: Package site
        if: github.event_name == 'push' || steps.snapshot.outputs.changed == 'true'
        run: python3 scripts/package_site.py
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' || steps.snapshot.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' || steps.snapshot.outputs.changed == 'true'
        with:
          path: _site
      - name: Publish
        id: deployment
        if: github.event_name == 'push' || steps.snapshot.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
